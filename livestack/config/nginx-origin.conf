# nginx origin for the HLS ladder. Installed by server/boot.sh, which replaces
# __ORIGIN_HOST__ with ORIGIN_HOST from /etc/livestack/env.
# Files: /var/www/hls/<path>/master.m3u8 -> https://<ORIGIN_HOST>/hls/<path>/master.m3u8
#
# TLS cert/key are symlinks managed by server/cert_sync.sh (Let's Encrypt, or a
# self-signed fallback so nginx can always start).
# Note: Ubuntu 24.04 ships nginx 1.24, so http2 is set on the listen line.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __ORIGIN_HOST__;
    server_tokens off;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __ORIGIN_HOST__;
    server_tokens off;

    ssl_certificate     /etc/livestack/tls/fullchain.pem;
    ssl_certificate_key /etc/livestack/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Read-only origin: GET and HEAD only.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /hls/ {
        root /var/www;                      # /hls/x -> /var/www/hls/x
        autoindex off;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
            video/iso.segment             m4s;
            video/mp4                     mp4;
        }
        default_type application/octet-stream;

        # Playlists change every segment: never cache.
        location ~ \.m3u8$ {
            add_header Cache-Control "no-cache" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
        # Segments are immutable once written.
        location ~ \.(ts|m4s)$ {
            add_header Cache-Control "public, max-age=60" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
        # FFmpeg's in-progress files (temp_file flag) are never served.
        location ~ \.tmp$ { return 404; }

        add_header Access-Control-Allow-Origin "*" always;
    }

    location / { return 404; }
}
